name: Build Heltec V3 Companion WiFi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Set up PlatformIO
      run: |
        pip install platformio

    - name: Patch platformio.ini
      run: |
        sed -i 's/myssid/${{ secrets.WIFI_SSID }}/' variants/heltec_v3/platformio.ini
        sed -i 's/mypwd/${{ secrets.WIFI_PWD }}/' variants/heltec_v3/platformio.ini

    - name: Build project
      run: |
        pio run -e Heltec_v3_companion_radio_wifi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v2
      with:
        name: Heltec V3 Companion WiFi
        path: .pio/build/Heltec_v3_companion_radio_wifi/*.bin
